name: Dice Thrower CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/run-android-ui-tests.sh'
      - 'scripts/tests/**'
  pull_request:
    paths:
      - 'src/**'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/run-android-ui-tests.sh'
      - 'scripts/tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dice-thrower-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Validate all advertised localizations
        run: python3 scripts/validate_localizations.py

      - name: Test native UI runner exit status and diagnostics collection
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test and compile app and instrumentation APKs
        working-directory: src
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dice-thrower-debug-${{ github.sha }}
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Keep an actual Android runtime regression gate: JVM unit tests did not catch
  # the ICU regex incompatibility that caused the Add Roll production crash.
  instrumentation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 37 SDK for instrumentation builds
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI regression tests on emulator
        id: instrumentation-tests
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2560M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan
          disable-animations: true
          script: bash scripts/run-android-ui-tests.sh --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1536m

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dice-thrower-instrumentation-${{ github.sha }}
          path: |
            src/app/build/reports/androidTests/connected/**
            src/app/build/outputs/androidTest-results/connected/**
            src/app/build/outputs/e2e-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce instrumentation result
        if: steps.instrumentation-tests.outcome != 'success'
        run: exit 1
