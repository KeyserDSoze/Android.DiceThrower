    <text x="65" y="72" text-anchor="middle" fill="#ffe49b" font-family="Georgia,serif" font-size="27">14</text>
    <text x="178" y="78" text-anchor="middle" fill="#ffe49b" font-family="Georgia,serif" font-size="25">8</text>
    <text x="177" y="167" text-anchor="middle" fill="#ffe49b" font-family="Georgia,serif" font-size="24">2</text>
