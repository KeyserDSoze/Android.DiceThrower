<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050714"/>
      <stop offset="0.52" stop-color="#111b43"/>
      <stop offset="1" stop-color="#24114a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58c8ff" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#6548ff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6548ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b7"/>
      <stop offset=".45" stop-color="#ffd274"/>
      <stop offset="1" stop-color="#b77717"/>
    </linearGradient>
    <linearGradient id="dice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b72d9"/>
      <stop offset=".48" stop-color="#262080"/>
      <stop offset="1" stop-color="#661c8f"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="760" cy="232" r="238" fill="url(#glow)"/>
  <circle cx="920" cy="60" r="130" fill="#713cff" opacity=".14" filter="url(#blur)"/>
  <circle cx="640" cy="420" r="180" fill="#00aaff" opacity=".12" filter="url(#blur)"/>

  <g opacity=".26" fill="none" stroke="#72c9ff">
