  <g filter="url(#softShadow)" transform="translate(670 90) rotate(8 115 115)">
    <polygon points="115,0 206,41 230,136 166,220 64,230 0,145 20,46" fill="url(#dice)" stroke="url(#gold)" stroke-width="8"/>
    <path d="M115 0L111 109L20 46M111 109L206 41M111 109L230 136M111 109L166 220M111 109L64 230M111 109L0 145" fill="none" stroke="url(#gold)" stroke-width="5" opacity=".95"/>
