      <text x="59" y="27" text-anchor="middle" fill="#051321" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">SHAKE &amp; ROLL</text>
      <rect x="132" width="105" height="42" rx="21" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="184" y="27" text-anchor="middle" fill="#ffd274" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">LOCAL FIRST</text>
    </g>
