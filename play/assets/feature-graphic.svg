    <text x="0" y="156" fill="url(#gold)" font-family="Georgia,serif" font-size="78" font-weight="700" letter-spacing="-3">Thrower</text>
    <rect x="2" y="181" width="310" height="2" rx="1" fill="#ffd274" opacity=".55"/>
    <text x="0" y="224" fill="#f5f6ff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Create characters. Roll instantly.</text>
    <text x="0" y="264" fill="#adb8d8" font-family="Inter,Arial,sans-serif" font-size="16">Offline · game-agnostic · parameterized rolls</text>
    <g transform="translate(0 298)">
