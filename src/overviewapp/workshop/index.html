    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#0a0b14" />
    <meta name="description" content="Create, store and share Dice Thrower characters in your browser, without an account. Import them on Android by link or QR code." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Character Workshop — Dice Thrower" />
    <meta property="og:description" content="Create, store and share Dice Thrower characters in your browser, without an account. Import them on Android by link or QR code." />
    <title>Character Workshop — Dice Thrower</title>
    <script>
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem('dicethrower-site-theme');
          dark = saved ? saved === 'dark' : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        } catch (e) {
          dark = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
